services:
  source-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${USERNAME}
      POSTGRES_DB: ${SOURCE_DATABASE}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - source_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERNAME} -d ${SOURCE_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:15432:15432"
    depends_on:
      source-db:
        condition: service_healthy

  sqlite-ui:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - ./data/:/data
    environment:
      - SQLITE_DATABASE=bench_results.db
volumes:
  source_pgdata:
