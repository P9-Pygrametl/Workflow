services:
  source-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${USERNAME}
      POSTGRES_DB: ${SOURCE_DATABASE}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - source_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERNAME} -d ${SOURCE_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:15432:15432"
    depends_on:
      source-db:
        condition: service_healthy

  toxiproxy-init:
    image: curlimages/curl:8.11.0
    depends_on:
      toxiproxy:
        condition: service_started
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf http://toxiproxy:8474/proxies >/dev/null; do sleep 0.5; done
        curl -sf http://toxiproxy:8474/proxies/${TOXIPROXY_PROXY} >/dev/null 2>&1 || \
        curl -sf -X POST http://toxiproxy:8474/proxies \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"${TOXIPROXY_PROXY}\",\"listen\":\"0.0.0.0:15432\",\"upstream\":\"source-db:5432\",\"enabled\":true}"

  sqlite-ui:
    image: coleifer/sqlite-web
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./data/:/data
    environment:
      - SQLITE_DATABASE=benchmark_results.db
volumes:
  source_pgdata:
